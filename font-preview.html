<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview de fuentes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Londrina+Sketch&family=Luckiest+Guy&family=Griffy&family=Knewave&family=Cherry+Bomb+One&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Lato", system-ui, sans-serif;
      background: #a9c58a;
      color: #2f4a2a;
    }
    .option {
      display: grid;
      place-items: center;
      gap: 0.5rem;
      padding: 3rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid rgba(47, 74, 42, 0.25);
    }
    .option small {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.75rem;
      opacity: 0.75;
    }
    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(2.2rem, 8.5vw, 6rem);
      white-space: nowrap;
      line-height: 1.1;
    }
    h1 .amp { color: #a86c44; }
    .f1 { font-family: "Fredericka the Great", cursive; }
    .f2 { font-family: "Londrina Sketch", cursive; }
    .f3 { font-family: "Luckiest Guy", cursive; }
    .f4 { font-family: "Griffy", cursive; }
    .f5 { font-family: "Knewave", cursive; }
  </style>
</head>
<body>
  <section class="option">
    <small>1 · Fredericka the Great (base)</small>
    <h1 class="f1">Barbara <span class="amp">&amp;</span> Dante</h1>
  </section>
  <section class="option">
    <small>2 · Londrina Sketch</small>
    <h1 class="f2">Barbara <span class="amp">&amp;</span> Dante</h1>
  </section>
  <section class="option">
    <small>3 · Luckiest Guy</small>
    <h1 class="f3">Barbara <span class="amp">&amp;</span> Dante</h1>
  </section>
  <section class="option">
    <small>4 · Griffy</small>
    <h1 class="f4">Barbara <span class="amp">&amp;</span> Dante</h1>
  </section>
  <section class="option">
    <small>5 · Knewave</small>
    <h1 class="f5">Barbara <span class="amp">&amp;</span> Dante</h1>
  </section>
</body>
</html>
